# Custom Valet configuration for OSR Digital
# This file adds proper static file serving for Vite build assets

# Serve static files from public directory directly
location ~ ^/build/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    access_log off;
    try_files $uri =404;
}

# Serve other static assets
location ~ \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map|json)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    access_log off;
    try_files $uri =404;
}
